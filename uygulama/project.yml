# XcodeGen tanımı (brew install xcodegen; xcodegen generate). Önce: ./arac/uygulama_kitaplik.sh xcframework
name: Umay
options:
  bundleIdPrefix: org.umay
  deploymentTarget: { iOS: "16.0", macOS: "12.0" }
targets:
  Umay:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Umay
      - path: ../docs/kaynak
        type: folder
        buildPhase: resources
      - path: ../kut
        type: folder
        excludes: ["model/**", "gelen/**", "_ogren/**"]
        buildPhase: resources
    dependencies:
      - framework: ../kov/uyg/Umay.xcframework
        embed: false
      - sdk: libc++.tbd
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Umay/UmayKopru.h
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: UMAY
        MARKETING_VERSION: "0.1"
        PRODUCT_BUNDLE_IDENTIFIER: org.umay.uygulama
        # Face ID gerekcesi ZORUNLU: olmadan biyometri cagrisinda
        # uygulama coker (iOS kurali). Kasa anahtari biyometri
        # korumali depoda durur; bkz. uygulama/Umay/KasaBiyometri.swift
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Kasayı yüzünle açmak için"

        # Biyometri cercevesi. 'import LocalAuthentication' kendiliginden
        # baglanir ama bagimliligi burada yazili tutmak, cerceve
        # listesini okuyarak neyi kullandigimizi gormeyi saglar.
