# Her itiş ve çekme isteğinde otomatik derleme + sınama. Bilgi (kut/, docs/kaynak/) değişince
# eğitim verisi de yeniden üretilir. Swift/iOS işleri bu ortamda denenemediği için burada ilk kez derlenir.
name: yap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make sina
      - run: make gomulu-sina
      - run: make otuken-denetle
      # GIZLILIK DUVARI, KOSUT CAGRI ALTINDA. sina tek is parcali ve
      # ÖTÜKEN kipinde de derlendigi icin pthread oraya girmez; yarisma
      # ancak gercek kosut cagri ile gorunur. Olculdu: duraagan
      # arabellekli eski kodda 8 is parcasiyla 33943 kez gizli metin
      # KACIYORDU (acik tarafa dusme). Bu kapi onun geri gelmesini
      # engeller.
      - run: make duvar-kosut
      # PDF AYRISTIRICI, GUVENILMEZ GIRDIYLE. 1065 satir, 89 dongu ve
      # kullanicinin yukledigi/agdan inen belgeleri okuyor; sina'da
      # yalniz 6 denetim var. ASan + UBSan altinda bozulmus, kesilmis
      # ve asiri ic ice PDF'ler verilir. Arac derinlik kanitini da
      # sayar: bastan reddedilen girdi yigini hicbir sey kanitlamaz.
      - run: make pdf-yagmur

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: make sina
      - name: macOS uygulaması (Swift + gömülü motor)
        run: ./arac/mac_uygulama.sh
      - uses: actions/upload-artifact@v4
        with: { name: Umay.app, path: kov/Umay.app }

  ios-benzetim:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: ./arac/uygulama_kitaplik.sh xcframework
      - run: cd uygulama && xcodegen generate
      - run: >
          xcodebuild -project uygulama/Umay.xcodeproj -scheme Umay
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  veri:
    # Yeni bilgi geldiğinde (kut/ ya da docs/kaynak/ değişince) eğitim verisini yeniden üret.
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: degisim
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(kut/|docs/kaynak/)'; then echo "var=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.degisim.outputs.var == '1' || github.event_name == 'workflow_dispatch'
        run: make && UMAY_OGREN=0 ./kov/umay --veri > veri.jsonl
      - if: steps.degisim.outputs.var == '1' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with: { name: veri.jsonl, path: veri.jsonl }
